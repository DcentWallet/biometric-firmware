# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: deployment-biometric-firmware

on:
  push:
    branches: [ master ]

jobs:
  release-and-deploy:

    runs-on: ubuntu-22.04

    # AWS는 장기 액세스 키 대신 OIDC 역할로 접근한다. 역할은 이 레포 master 브랜치에서 도는 워크플로만 쓸 수 있다
    # (신뢰 정책: IotrustGitHub/infra terraform/accounts/dcent/oidc-github-actions)
    permissions:
      contents: write   # Create Release
      id-token: write   # AWS OIDC

    steps:
    - uses: actions/checkout@v2
    
    - name: Retrieve version
      run: echo "TAG_NAME=v$(head -n 1 bin/info.yml | sed 's/version:\s//')" >> $GITHUB_ENV

    # 릴리스를 만들기 전에 역할을 먼저 받는다. assume이 실패하면 릴리스와 태그가 생기기 전에 멈춘다
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      with:
        # 이 레포 master 브랜치에서만 assume할 수 있는 역할이라 ARN은 비밀값이 아니다
        role-to-assume: arn:aws:iam::564714665430:role/github-actions-dcent-biometric-firmware
        aws-region: ap-northeast-2

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.TAG_NAME }}

    - name: Deploy to AWS S3
      run: aws s3 cp --recursive bin ${{ secrets.AWS_S3_BUCKET_FW }}

    - name: CloudFront Cache clear
      run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CF_DISTRIBUTION_ID }} --paths ${{ secrets.AWS_CF_BIOMETRIC_FIRMWARE }}